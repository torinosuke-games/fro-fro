# Supabase の無料プランの一時停止の対策（判断309）：3日に1回、データベースを1回呼ぶ。
# 失敗すると、このワークフローが赤くなる（GitHub から通知が届く）＝プロジェクトが止まっているかもしれない合図。
name: supabase-keepalive

on:
  schedule:
    - cron: '17 3 */3 * *'   # 3日に1回（UTC の 3:17 ＝ 日本時間の 12:17）
  workflow_dispatch: {}       # 手動でも動かせる（Actions の画面の「Run workflow」）

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Supabase を1回呼ぶ
        run: bash .github/scripts/supabase-keepalive.sh
