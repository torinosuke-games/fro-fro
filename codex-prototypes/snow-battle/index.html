<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eaf0ef">
<title>雪の峠のコマンドバトル · Frozen Frontier</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app" data-phase="commands">
<header class="app-header"><div class="wordmark"><small>FROZEN FRONTIER</small><strong>雪の峠の戦い <span>独立試作</span></strong></div><div class="header-tools"><button id="historyButton" aria-label="問題と解答の記録を開く"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h13v18H4zM8 7h5M8 11h5M8 15h3m6-9h3v15"/></svg><span>記録</span></button><button id="helpButton" aria-label="戦闘の説明を開く">？</button></div></header>
<nav class="flow" aria-label="このターンの進み方"><span id="turnLabel">TURN 01</span><ol><li data-step="commands">作戦</li><li data-step="quiz">問題</li><li data-step="review">解答</li><li data-step="action">行動</li></ol></nav>
<div class="battle-layout">
<section class="scene-column" aria-label="戦況">
<div id="stage" class="stage">
<img class="arena" src="assets/arena.webp" alt="雪山の峠と古い石のアーチ" decoding="async">
<div class="scene-wash" aria-hidden="true"></div>
<div class="location"><span>WHITE FRONTIER</span><b>白銀の峠</b></div>
<div class="enemy-status"><div><strong>氷角の大獣</strong><span id="enemyNumbers">360 / 360</span></div><div class="meter enemy-meter" role="progressbar" aria-label="敵のHP" aria-valuemin="0" aria-valuemax="360" aria-valuenow="360"><i id="enemyBar"></i></div><small id="enemyState">峠を守る、氷のけもの</small></div>
<div class="formation" aria-hidden="true"><div class="fighter" data-fighter="healer"><span class="ground-shadow"></span><img src="assets/healer.webp" alt=""></div><div class="fighter" data-fighter="guardian"><span class="ground-shadow"></span><img src="assets/guardian.webp" alt=""></div><div class="fighter" data-fighter="sword"><span class="ground-shadow"></span><img src="assets/sword.webp" alt=""></div><div class="fighter" data-fighter="hero"><span class="ground-shadow"></span><img src="assets/hero.webp" alt=""></div></div>
<div class="enemy-figure" id="enemyFigure" aria-hidden="true"><span class="ground-shadow"></span><img src="assets/enemy.webp" alt=""></div>
<div id="effect" class="effect" aria-hidden="true"></div><div id="floatText" class="float-text" aria-hidden="true"></div>
<div id="sceneMessage" class="scene-message" aria-live="polite">仲間とともに、峠の向こうへ。</div>
<button id="speedButton" class="speed-button" aria-label="演出速度を切り替える">演出 ×1</button>
</div>
<div id="party" class="party" aria-label="仲間の状態と予約した行動"></div>
</section>
<section id="console" class="console" aria-label="戦闘の操作"><div id="panel" class="panel"></div></section>
</div>
</main>
<dialog id="infoDialog" aria-labelledby="dialogTitle"><header><h2 id="dialogTitle"></h2><button id="closeDialog" aria-label="閉じる">×</button></header><div id="dialogBody"></div></dialog>
<div id="notice" role="status" aria-live="polite"></div>
<script src="data.js"></script><script src="battle.js"></script>
</body></html>
