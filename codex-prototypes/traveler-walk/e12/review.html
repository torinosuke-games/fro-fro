<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>e12 歩行シート確認</title><style>body{font:15px/1.7 system-ui;background:#eef1f2;color:#293d45;margin:0;padding:24px}main{max-width:850px;margin:auto}h1{font-size:22px}button,a{font:inherit}button{padding:8px 16px;border:1px solid #bbcacc;border-radius:8px;background:white}section{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.cell{text-align:center;background:#fff;border-radius:12px;padding:12px}canvas{display:block;margin:auto;background:repeating-conic-gradient(#e8eef0 0 25%,#fff 0 50%) 0/16px 16px;max-width:100%}.sheet{width:100%;background:repeating-conic-gradient(#e8eef0 0 25%,#fff 0 50%) 0/20px 20px}small{display:block}@media(max-width:550px){section{grid-template-columns:1fr 1fr}}</style><main><h1>e12 の歩行シート · 確認用</h1><p>前・後ろ・左・右の4方向、各4コマ。1秒で歩行1周。足の出し方と人物の一致を確認してください。左・右の接地コマは足を開き、通過コマは閉じます。Claude確認用です。</p><button id="play">停止する</button> <button id="step">次のコマ</button><span id="frame"></span><section id="previews"></section><p><a href="../../../img/adventure/travelers/e12-w.png" download="e12-w.png">e12-w.png を保存</a> · 2048×2048／透明PNG</p><img class="sheet" src="../../../img/adventure/travelers/e12-w.png" alt="e12の4方向4コマの歩行シート"></main><script>const sheet=new Image();sheet.src='../../../img/adventure/travelers/e12-w.png';let playing=true,frame=0;const canvases=[];for(const [i,name] of ['前','後ろ','左','右'].entries()){const box=document.createElement('div');box.className='cell';box.innerHTML=`<b>${name}</b><canvas width="160" height="160"></canvas><small>大きく表示</small><canvas width="80" height="80"></canvas><small>80pxで表示</small>`;document.getElementById('previews').append(box);for(const c of box.querySelectorAll('canvas'))canvases.push([c,i]);}function draw(){if(!sheet.complete||!sheet.naturalWidth)return;for(const[c,row]of canvases){const x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.drawImage(sheet,frame*512,row*512,512,512,0,0,c.width,c.height);}document.getElementById('frame').textContent=` コマ ${frame+1} / 4`;}sheet.onload=draw;document.getElementById('play').onclick=()=>{playing=!playing;document.getElementById('play').textContent=playing?'停止する':'再生する';};document.getElementById('step').onclick=()=>{playing=false;document.getElementById('play').textContent='再生する';frame=(frame+1)%4;draw();};setInterval(()=>{if(playing){frame=(frame+1)%4;draw();}},250);</script></html>
